<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password | ShopKart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(120deg, #eef2ff, #f8fafc);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      border: none;
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(135deg, #4e54c8, #8f94fb);
      color: #fff;
      text-align: center;
      padding: 24px;
    }

    .card-header h4 {
      font-weight: 700;
    }

    .form-control {
      border-radius: 10px;
      padding: 12px;
    }

    .btn-primary {
      border-radius: 10px;
      padding: 12px;
      font-weight: 600;
      background: linear-gradient(135deg, #4e54c8, #8f94fb);
      border: none;
    }

    .btn-primary:hover {
      opacity: 0.95;
    }

    /* 🌟 Stylish Alerts */
    .alert {
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.95rem;
      animation: slideDown 0.4s ease;
      border: none;
    }

    .alert-danger {
      background: #fdecea;
      color: #842029;
      border-left: 5px solid #dc3545;
    }

    .alert-success {
      background: #e9f7ef;
      color: #0f5132;
      border-left: 5px solid #198754;
    }

    .alert i {
      font-size: 20px;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .back-link {
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

<div class="card">
  <div class="card-header">
    <h4 class="mb-1">Forgot Password</h4>
    <small>Customer accounts only</small>
  </div>

  <div class="card-body p-4">

    <!-- 🔔 Stylish Django Messages -->
    {% if messages %}
      {% for message in messages %}
        <div class="alert 
          {% if message.tags == 'error' %}alert-danger{% endif %}
          {% if message.tags == 'success' %}alert-success{% endif %}
          alert-dismissible fade show" role="alert">

          <i class="bi 
            {% if message.tags == 'error' %}bi-exclamation-circle-fill{% endif %}
            {% if message.tags == 'success' %}bi-check-circle-fill{% endif %}">
          </i>

          <span>{{ message }}</span>

          <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}

    <form method="post" novalidate>
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label fw-semibold">Registered Email</label>
        {{ form.email }} <br>
        {% for error in form.email.errors %}
          <small class="text-danger">{{ error }}</small>
        {% endfor %}
      </div>

      <button type="submit" class="btn btn-primary w-100">
        Send OTP
      </button>
    </form>

    <div class="text-center mt-3 back-link">
      <a href="{% url 'login' %}" class="text-decoration-none">
        ← Back to Login
      </a>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // Auto-hide alerts after 5 seconds
  setTimeout(() => {
    document.querySelectorAll('.alert').forEach(alert => {
      alert.classList.remove('show');
    });
  }, 5000);
</script>

</body>
</html>
