<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex,nofollow,noarchive,nosnippet"
    >

    <meta
        http-equiv="Cache-Control"
        content="no-store,no-cache,must-revalidate,max-age=0"
    >

    <meta
        http-equiv="Pragma"
        content="no-cache"
    >

    <title>Invalid Reset Link | ShopKart</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .box {
            width: min(480px, 92%);
            background: #ffffff;
            padding: 40px;
            border-radius: 22px;
            text-align: center;
            box-shadow:
                0 20px 60px rgba(15,23,42,.12);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            color: #0f172a;
        }

        p {
            color: #64748b;
            line-height: 1.7;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 24px;
            border-radius: 10px;
            background: #2563eb;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="box">

    <div class="icon">
        ⚠️
    </div>

    <h1>
        Password Reset Link Invalid
    </h1>

    <p>
        This password reset link is invalid,
        expired, or has already been used.
    </p>

    <p>
        Please request a new password reset link.
    </p>

    <a href="{% url 'seller_forgot_password' %}">
        Request New Reset Link
    </a>

</div>

</body>

</html>
