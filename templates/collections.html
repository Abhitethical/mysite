

<h1>hbhkbkjn</h1>
<!-- Collection Grid -->
<section class="collection-grid">

  {% if catagory %}
    {% for item in catagory %}
      <div class="collection-card">
        <div class="card-img-wrapper">
          <img src="{{ item.image.url }}" alt="{{ item.name }}">
        </div>
        <div class="card-body">
          <h3>{{ item.name }}</h3>
          <p class="price">₹ {{ item.selling_price|stringformat:'d' }}</p>
          <a href="{% url 'collections' item.name %}" class="shop-btn">
            Shop Now <i class="fa fa-arrow-right"></i>
          </a>
        </div>
      </div>
    {% endfor %}
  {% else %}
    <div class="empty-state">
      <h4>No collections available 😕</h4>
      <p>Please check back later</p>
    </div>
  {% endif %}

</section>

<style>
/* Updated Card CSS */
.collection-card {
  background: #fff;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  transition: all 0.3s ease;
  display: flex;
  flex-direction: column;
  height: 400px; /* fixed card height */
}

.collection-card:hover {
  transform: translateY(-8px);
  box-shadow: 0 18px 35px rgba(0,0,0,0.15);
}

.card-img-wrapper {
  height: 60%; /* image takes 60% of card height */
  overflow: hidden;
}

.card-img-wrapper img {
  width: 100%;
  height: 100%;
  object-fit: cover; /* ensures image fills box without stretching */
  display: block;
}

.card-body {
  padding: 15px 20px;
  text-align: center;
  flex: 1; /* makes body occupy remaining space */
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.card-body h3 {
  font-size: 1.3rem;
  font-weight: 600;
  margin-bottom: 10px;
}

.price {
  font-size: 1.1rem;
  font-weight: 700;
  color: #7f5eff;
}

.shop-btn {
  margin-top: 15px;
  display: inline-block;
  padding: 10px 24px;
  background: #7f5eff;
  color: #fff;
  border-radius: 30px;
  text-decoration: none;
  font-weight: 500;
  transition: background 0.3s ease;
}

.shop-btn:hover {
  background: #6b48ff;
  color: #fff;
}
</style>
