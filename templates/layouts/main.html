<!doctype html>
<html lang="en">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>
      {% block title %}

      </title>

  </head>
  <body>
    {% include 'inc/navbar.html' %}
    {% block content %}
    {% endblock content %}
    {% block scripts %}
    {% endblock scripts %}
    {% include 'inc/footer.html' %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  

<script>
    
(() => {
    "use strict";

    const config = document.getElementById("visitor-tracking-config");

    if (!config || config.dataset.enabled !== "true") {
        return;
    }

    const heartbeatUrl = config.dataset.heartbeatUrl;
    const exitUrl = config.dataset.exitUrl;
    const csrfToken = config.dataset.csrfToken;
    const startedAt = performance.now();

    let lastActivity = "view";
    let lastHeartbeat = 0;

    function send(url, values, keepalive = false) {
        const body = new URLSearchParams();

        Object.entries(values).forEach(([key, value]) => {
            body.set(key, String(value ?? ""));
        });

        return fetch(url, {
            method: "POST",
            credentials: "same-origin",
            keepalive,
            headers: {
                "Content-Type": "application/x-www-form-urlencoded",
                "X-CSRFToken": csrfToken,
                "X-Requested-With": "XMLHttpRequest"
            },
            body: body.toString()
        });
    }

    function pageData() {
        return {
            path: window.location.pathname,
            title: document.title,
            activity: lastActivity,
            screen_width: window.screen.width,
            screen_height: window.screen.height
        };
    }

    function heartbeat() {
        if (document.visibilityState === "hidden") {
            return;
        }

        lastHeartbeat = Date.now();
        lastActivity = "view";

        send(heartbeatUrl, pageData()).catch(() => {
            // A failed heartbeat is retried on the next interval.
        });
    }

    ["click", "keydown", "scroll", "touchstart"].forEach((eventName) => {
        document.addEventListener(
            eventName,
            () => {
                lastActivity = eventName;
            },
            { passive: true }
        );
    });

    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
            heartbeat();
        }
    });

    window.addEventListener("pagehide", () => {
        const duration = Math.min(
            86400,
            Math.max(0, Math.floor((performance.now() - startedAt) / 1000))
        );

        send(exitUrl, {
            path: window.location.pathname,
            duration: duration
        }, true).catch(() => {});
    });

    heartbeat();
    window.setInterval(heartbeat, 20000);
})();


</script>



    <!-- Your existing page content -->

    <script>
    (function () {
        window.addEventListener("pageshow", function (event) {
            if (event.persisted) {
                window.location.reload();
            }
        });
    })();
    </script>



  </body>
</html>
