<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex,nofollow,noarchive,nosnippet"
    >

    <meta
        http-equiv="Cache-Control"
        content="no-store,no-cache,must-revalidate,max-age=0"
    >

    <meta
        http-equiv="Pragma"
        content="no-cache"
    >

    <title>Password Changed | ShopKart</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8fafc;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .box {
            width: min(480px, 92%);
            background: white;
            padding: 45px;
            border-radius: 22px;
            text-align: center;
            box-shadow:
                0 20px 60px rgba(15,23,42,.12);
        }

        .success {
            width: 70px;
            height: 70px;
            margin: auto auto 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #16a34a;
            color: white;
            font-size: 35px;
        }

        h1 {
            color: #0f172a;
        }

        p {
            color: #64748b;
            line-height: 1.7;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 28px;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="box">

    <div class="success">
        ✓
    </div>

    <h1>
        Password Changed
    </h1>

    <p>
        Your account password
        has been changed successfully.
    </p>

    <p>
        The password reset link has now been
        permanently invalidated.
    </p>

    <a href="{% url 'login' %}">
        Go to Login
    </a>

</div>

</body>

</html>
