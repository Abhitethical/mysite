{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Reset Successful</title>

    <!-- Correct way to load Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
        }
        .success-card {
            border-radius: 15px;
            padding: 40px;
            animation: fadeIn 0.7s ease-in-out;
        }
        .success-icon {
            font-size: 60px;
            color: #28a745;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-lg success-card text-center bg-white">
        
        <div class="success-icon mb-3">
            ✓
        </div>

        <h2 class="text-success fw-bold">Password Reset Successful</h2>
        <p class="text-muted mt-2">
            {{ message }}
        </p>

        <a href="{% url 'login' %}" class="btn btn-primary btn-lg mt-3 px-4">
            Go to Login
        </a>

    </div>
</div>

</body>
</html>
