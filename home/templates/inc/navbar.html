
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="ShopKart - Discover fashion, electronics and more at amazing prices.">

    <meta name="theme-color" content="#111827">

    <title>ShopKart | Premium Online Shopping</title>

    <!-- =========================================================
         GOOGLE FONT
    ========================================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- =========================================================
         BOOTSTRAP
    ========================================================== -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- =========================================================
         FONT AWESOME
    ========================================================== -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- =========================================================
         AOS ANIMATION
    ========================================================== -->
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css"
          rel="stylesheet">


    <style>

        /* =====================================================
           GLOBAL
        ====================================================== */

        :root {
            --primary: #643dff;
            --primary-dark: #5e2de5;
            --secondary: #111827;
            --dark: #0f172a;
            --text: #374151;
            --muted: #6b7280;
            --light: #f8fafc;
            --white: #ffffff;
            --border: #e5e7eb;
            --success: #16a34a;
            --warning: #f59e0b;
            --shadow-sm: 0 5px 20px rgba(15, 23, 42, 0.06);
            --shadow-lg: 0 20px 50px rgba(15, 23, 42, 0.12);
            --radius: 18px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            color: var(--text);
            overflow-x: hidden;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Poppins', sans-serif;
        }

        a {
            text-decoration: none;
        }

        img {
            max-width: 100%;
        }

        .container {
            max-width: 1280px;
        }


        /* =====================================================
           TOP ANNOUNCEMENT BAR
        ====================================================== */

        .announcement-bar {
            background: linear-gradient(
                90deg,
                #111827,
                #1f2937,
                #111827
            );

            color: white;
            padding: 9px 15px;
            font-size: 13px;
            letter-spacing: .2px;
        }

        .announcement-bar strong {
            color: hsl(253, 100%, 70%);
        }

        .announcement-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 0 15px;
        }


        /* =====================================================
           NAVBAR
        ====================================================== */

        .main-navbar {
            background: rgba(255, 255, 255, .96);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            border-bottom: 1px solid rgba(0, 0, 0, .06);

            padding: 14px 0;

            transition: .3s ease;

            z-index: 1050;
        }

        .navbar-brand {
            font-family: 'Poppins', sans-serif;
            font-size: 25px;
            font-weight: 800;
            color: var(--secondary) !important;
            letter-spacing: -.7px;
        }

        .navbar-brand i {
            color: var(--primary);
            margin-right: 5px;
        }

        .navbar-brand span {
            color: var(--primary);
        }

        .nav-link {
            color: #374151 !important;
            font-weight: 600;
            font-size: 14px;
            margin: 0 5px;
            padding: 9px 12px !important;
            border-radius: 9px;
            transition: .25s ease;
        }

        .nav-link:hover {
            color: var(--primary) !important;
            background: #fff1f3;
        }

        .nav-icon-link {
            position: relative;
        }

        .nav-badge {
            position: absolute;
            top: 0;
            right: 0;

            background: var(--primary);
            color: white;

            width: 17px;
            height: 17px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-size: 9px;
            font-weight: 700;
        }


        /* =====================================================
           SEARCH
        ====================================================== */

        .search-box {
            width: 360px;
            position: relative;
        }

        .search-box input {
            height: 45px;
            border-radius: 50px;
            border: 1px solid #e5e7eb;
            background: #f8fafc;
            padding: 0 50px 0 20px;
            font-size: 14px;
            transition: .3s ease;
        }

        .search-box input:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(255, 61, 87, .08);
        }

        .search-box button {
            position: absolute;
            right: 5px;
            top: 5px;

            width: 35px;
            height: 35px;

            border: none;
            border-radius: 50%;

            background: var(--primary);
            color: white;

            transition: .3s ease;
        }

        .search-box button:hover {
            background: var(--primary-dark);
            transform: scale(1.05);
        }


        /* =====================================================
           HERO
        ====================================================== */

        .hero-section {
            position: relative;
            overflow: hidden;

            min-height: 570px;

            display: flex;
            align-items: center;

            background:
                radial-gradient(
                    circle at 85% 20%,
                    rgba(255,255,255,.15),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 10% 90%,
                    rgba(255,255,255,.10),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #111827 0%,
                    #1f2937 50%,
                    #6e15dc 150%
                );

            color: white;
        }

        .hero-section::before {
            content: "";
            position: absolute;

            width: 500px;
            height: 500px;

            border: 1px solid rgba(255,255,255,.1);
            border-radius: 50%;

            right: -150px;
            top: -150px;
        }

        .hero-section::after {
            content: "";
            position: absolute;

            width: 300px;
            height: 300px;

            border: 1px solid rgba(255,255,255,.08);
            border-radius: 50%;

            left: -120px;
            bottom: -130px;
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .hero-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            background: rgba(255,255,255,.1);
            border: 1px solid rgba(255,255,255,.18);

            padding: 8px 15px;
            border-radius: 50px;

            font-size: 13px;
            font-weight: 600;

            margin-bottom: 20px;

            backdrop-filter: blur(10px);
        }

        .hero-tag i {
            color: #4f14e3;
        }

        .hero-title {
            font-size: clamp(42px, 6vw, 76px);
            line-height: 1.03;
            font-weight: 800;
            letter-spacing: -3px;
            margin-bottom: 22px;
        }

        .hero-title span {
            color: #ff6679;
        }

        .hero-description {
            color: rgba(255,255,255,.72);
            font-size: 17px;
            line-height: 1.8;
            max-width: 600px;
        }

        .hero-buttons {
            margin-top: 30px;
        }

        .btn-primary-custom {
            background: var(--primary);
            border: none;
            color: white;

            padding: 14px 26px;
            border-radius: 10px;

            font-weight: 700;
            font-size: 14px;

            transition: .3s ease;
            box-shadow: 0 10px 30px rgba(255,61,87,.25);
        }

        .btn-primary-custom:hover {
            background: hsl(251, 100%, 66%);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(255,61,87,.35);
        }

        .btn-outline-custom {
            border: 1px solid rgba(255,255,255,.3);
            color: white;

            padding: 13px 25px;
            border-radius: 10px;

            font-weight: 700;
            font-size: 14px;

            margin-left: 10px;

            transition: .3s ease;
        }

        .btn-outline-custom:hover {
            background: white;
            color: var(--secondary);
        }

        .hero-stats {
            margin-top: 45px;
            display: flex;
            gap: 40px;
        }

        .hero-stat h4 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 3px;
        }

        .hero-stat p {
            margin: 0;
            color: rgba(255,255,255,.6);
            font-size: 12px;
        }


        /* =====================================================
           ADVERTISEMENT SECTION
        ====================================================== */

        .ad-section {
            padding: 35px 0;
            background: #f8fafc;
        }

        .ad-wrapper {
            position: relative;

            background: #111827;

            border-radius: 22px;

            min-height: 260px;

            overflow: hidden;

            box-shadow: var(--shadow-lg);
        }

        .ad-wrapper::before {
            content: "";

            position: absolute;

            width: 400px;
            height: 400px;

            border-radius: 50%;

            background: rgba(255,61,87,.12);

            right: -150px;
            top: -200px;
        }

        #adBox {
            position: relative;
            z-index: 2;

            min-height: 260px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ad-content {
            width: 100%;
            padding: 25px 35px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 30px;
        }

        .ad-info {
            flex: 1;
            color: white;
        }

        .ad-label {
            display: inline-block;

            color: #483bf6;
            font-size: 11px;
            font-weight: 800;

            letter-spacing: 1.5px;
            text-transform: uppercase;

            margin-bottom: 10px;
        }

        .ad-info h2 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .ad-info p {
            color: rgba(255,255,255,.65);
            font-size: 14px;
            max-width: 550px;
            margin-bottom: 0;
        }

        .ad-media {
            width: 400px;
            max-width: 40%;
        }

        .ad-media img,
        .ad-media video {
            width: 100%;
            height: 210px;
            object-fit: cover;
            border-radius: 15px;
            background: #000;
        }

        .ad-close {
            position: absolute;

            top: 12px;
            right: 15px;

            width: 30px;
            height: 30px;

            border: none;
            border-radius: 50%;

            background: rgba(255,255,255,.1);
            color: white;

            z-index: 10;
        }


        /* =====================================================
           SECTION HEADINGS
        ====================================================== */

        .section-space {
            padding: 90px 0;
        }

        .section-heading {
            margin-bottom: 45px;
        }

        .section-eyebrow {
            color: var(--primary);
            text-transform: uppercase;

            letter-spacing: 2px;

            font-size: 11px;
            font-weight: 800;

            margin-bottom: 8px;
        }

        .section-title {
            font-size: 34px;
            font-weight: 800;
            color: var(--secondary);
            letter-spacing: -1px;
        }

        .section-description {
            color: var(--muted);
            max-width: 550px;
            margin: 10px auto 0;
            font-size: 14px;
            line-height: 1.7;
        }


        /* =====================================================
           CATEGORY CARDS
        ====================================================== */

        .category-card {
            position: relative;

            background: white;

            border-radius: 18px;

            padding: 25px 15px;

            text-align: center;

            border: 1px solid #edf0f4;

            transition: .35s ease;

            height: 100%;
        }

        .category-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255,61,87,.15);
            box-shadow: var(--shadow-lg);
        }

        .category-icon {
            width: 65px;
            height: 65px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 15px;

            border-radius: 18px;

            background: #fff1f3;

            color: var(--primary);

            font-size: 25px;

            transition: .3s ease;
        }

        .category-card:hover .category-icon {
            background: var(--primary);
            color: white;
            transform: rotate(-5deg);
        }

        .category-card h6 {
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 5px;
        }

        .category-card p {
            color: var(--muted);
            font-size: 12px;
            margin: 0;
        }


        /* =====================================================
           PRODUCTS
        ====================================================== */

        .products-section {
            background: #f8fafc;
        }

        .product-card {
            position: relative;

            background: white;

            border: 1px solid #edf0f4;

            border-radius: 18px;

            overflow: hidden;

            height: 100%;

            transition: .35s ease;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
            border-color: transparent;
        }

        .product-image-wrapper {
            position: relative;
            background: #f8fafc;
            overflow: hidden;
        }

        .product-image {
            width: 100%;
            height: 260px;

            object-fit: cover;

            transition: .5s ease;
        }

        .product-card:hover .product-image {
            transform: scale(1.06);
        }

        .product-badge {
            position: absolute;

            top: 14px;
            left: 14px;

            padding: 6px 10px;

            border-radius: 7px;

            background: var(--primary);
            color: white;

            font-size: 10px;
            font-weight: 800;

            text-transform: uppercase;
            letter-spacing: .5px;
        }

        .product-actions {
            position: absolute;

            top: 14px;
            right: 14px;

            display: flex;
            flex-direction: column;

            gap: 7px;
        }

        .product-action {
            width: 36px;
            height: 36px;

            border: none;
            border-radius: 50%;

            background: rgba(255,255,255,.95);

            color: #374151;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow: 0 4px 15px rgba(0,0,0,.08);

            transition: .25s ease;
        }

        .product-action:hover {
            background: var(--primary);
            color: white;
            transform: scale(1.08);
        }

        .product-body {
            padding: 20px;
        }

        .product-category {
            color: var(--primary);
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 7px;
        }

        .product-name {
            color: var(--secondary);
            font-size: 15px;
            font-weight: 700;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

            margin-bottom: 8px;
        }

        .product-rating {
            color: #f59e0b;
            font-size: 11px;
            margin-bottom: 12px;
        }

        .product-rating span {
            color: #9ca3af;
            margin-left: 5px;
        }

        .product-price {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-top: 12px;
        }

        .price {
            color: var(--secondary);
            font-size: 19px;
            font-weight: 800;
        }

        .view-product {
            width: 40px;
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background: #fff1f3;
            color: var(--primary);

            transition: .25s ease;
        }

        .view-product:hover {
            background: var(--primary);
            color: white;
        }


        /* =====================================================
           FEATURE STRIP
        ====================================================== */

        .feature-strip {
            background: white;
            border-top: 1px solid #edf0f4;
            border-bottom: 1px solid #edf0f4;
            padding: 30px 0;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 15px;

            padding: 10px 20px;

            border-right: 1px solid #edf0f4;
        }

        .feature-item:last-child {
            border-right: none;
        }

        .feature-icon {
            min-width: 50px;
            width: 50px;
            height: 50px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #fff1f3;

            color: var(--primary);

            border-radius: 14px;

            font-size: 20px;
        }

        .feature-item h6 {
            margin: 0 0 3px;
            font-size: 13px;
            font-weight: 800;
        }

        .feature-item p {
            margin: 0;
            font-size: 11px;
            color: var(--muted);
        }


        /* =====================================================
           PROMO BANNER
        ====================================================== */

        .promo-banner {
            position: relative;

            overflow: hidden;

            background:
                linear-gradient(
                    120deg,
                    #ff3d57,
                    #e92f4a
                );

            border-radius: 24px;

            padding: 55px;

            color: white;
        }

        .promo-banner::after {
            content: "";

            position: absolute;

            width: 320px;
            height: 320px;

            border: 1px solid rgba(255,255,255,.15);

            border-radius: 50%;

            right: -100px;
            top: -120px;
        }

        .promo-content {
            position: relative;
            z-index: 2;
        }

        .promo-content h2 {
            font-size: 34px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .promo-content p {
            color: rgba(255,255,255,.8);
            max-width: 580px;
            font-size: 14px;
            line-height: 1.7;
        }

        .promo-code {
            display: inline-block;

            margin-top: 15px;

            padding: 10px 16px;

            background: rgba(255,255,255,.13);

            border: 1px dashed rgba(255,255,255,.4);

            border-radius: 8px;

            font-size: 13px;
            font-weight: 700;
        }


        /* =====================================================
           NEWSLETTER
        ====================================================== */

        .newsletter {
            background: #111827;
            padding: 70px 0;
            color: white;
        }

        .newsletter h2 {
            font-size: 30px;
            font-weight: 800;
        }

        .newsletter p {
            color: #9ca3af;
            font-size: 14px;
        }

        .newsletter-form {
            position: relative;
            max-width: 500px;
            margin: 25px auto 0;
        }

        .newsletter-form input {
            width: 100%;
            height: 52px;

            border: none;
            border-radius: 50px;

            padding: 0 145px 0 20px;

            outline: none;
        }

        .newsletter-form button {
            position: absolute;

            right: 5px;
            top: 5px;

            height: 42px;

            border: none;
            border-radius: 50px;

            background: var(--primary);
            color: white;

            padding: 0 22px;

            font-size: 13px;
            font-weight: 700;
        }


        /* =====================================================
           FOOTER
        ====================================================== */

        footer {
            background: #0b1120;
            color: #94a3b8;
            padding-top: 65px;
        }

        .footer-brand {
            font-size: 25px;
            font-weight: 800;
            color: white;
        }

        .footer-brand i {
            color: var(--primary);
        }

        .footer-description {
            font-size: 13px;
            line-height: 1.8;
            max-width: 320px;
            margin-top: 15px;
        }

        .footer-title {
            color: white;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .footer-links {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .footer-links li {
            margin-bottom: 10px;
        }

        .footer-links a {
            color: #94a3b8;
            font-size: 12px;
            transition: .25s ease;
        }

        .footer-links a:hover {
            color: var(--primary);
            padding-left: 4px;
        }

        .social-links {
            display: flex;
            gap: 8px;
            margin-top: 20px;
        }

        .social-link {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background: rgba(255,255,255,.05);

            color: #cbd5e1;

            transition: .25s ease;
        }

        .social-link:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-3px);
        }

        .footer-bottom {
            border-top: 1px solid rgba(255,255,255,.07);

            margin-top: 45px;

            padding: 20px 0;

            font-size: 11px;
        }


        /* =====================================================
           BACK TO TOP
        ====================================================== */

        #backToTop {
            position: fixed;

            right: 25px;
            bottom: 25px;

            width: 45px;
            height: 45px;

            border: none;
            border-radius: 50%;

            background: var(--primary);
            color: white;

            box-shadow: 0 10px 30px rgba(255,61,87,.3);

            opacity: 0;
            visibility: hidden;

            transition: .3s ease;

            z-index: 999;
        }

        #backToTop.show {
            opacity: 1;
            visibility: visible;
        }


        /* =====================================================
           RESPONSIVE
        ====================================================== */

        @media (max-width: 991px) {

            .search-box {
                width: 100%;
                margin: 15px 0;
            }

            .navbar-nav {
                padding-top: 10px;
            }

            .hero-section {
                min-height: 520px;
            }

            .hero-title {
                letter-spacing: -2px;
            }

            .ad-content {
                flex-direction: column;
                text-align: center;
            }

            .ad-media {
                max-width: 100%;
                width: 500px;
            }

            .feature-item {
                border-right: none;
                border-bottom: 1px solid #edf0f4;
                padding: 15px;
            }

            .feature-item:last-child {
                border-bottom: none;
            }
        }

        @media (max-width: 767px) {

            .announcement-bar {
                font-size: 11px;
            }

            .announcement-item {
                margin: 0 5px;
            }

            .hero-section {
                min-height: 590px;
                text-align: center;
            }

            .hero-title {
                font-size: 44px;
            }

            .hero-description {
                margin: auto;
                font-size: 14px;
            }

            .hero-stats {
                justify-content: center;
                gap: 20px;
            }

            .hero-buttons {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }

            .btn-outline-custom {
                margin-left: 0;
            }

            .section-space {
                padding: 65px 0;
            }

            .section-title {
                font-size: 28px;
            }

            .product-image {
                height: 220px;
            }

            .promo-banner {
                padding: 35px 25px;
            }

            .promo-content h2 {
                font-size: 27px;
            }

            .ad-content {
                padding: 30px 20px;
            }

            .ad-info h2 {
                font-size: 23px;
            }

            .ad-media img,
