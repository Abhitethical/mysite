<h2>Admin Return Dashboard</h2>

{% for r in returns %}
  <div style="border:1px solid black; margin:10px; padding:10px;">
    <p>User: {{ r.user.username }}</p>
    <p>Product: {{ r.order.product_name }}</p>
    <p>Status: {{ r.status }}</p>

    <a href="{% url 'approve_return' r.id %}">Approve</a>
    <a href="{% url 'reject_return' r.id %}">Reject</a>
  </div>
{% endfor %}
